<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admission Form</title>
</head>
<body>

  <h1>Student Admission Form</h1>

  <form action="#" method="post">

    <fieldset>
      <legend>Personal Information</legend>

      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter Your Full Name" required>
      <br><br>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" placeholder="username@gmail.com" required>
      <br><br>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>
      <br><br>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="16" max="60" placeholder="16-" required>
      <br><br>

      <label for="city">City:</label>
      <select id="city" name="city">
        <option value="islamabad">Islamabad</option>
        <option value="lahore">Lahore</option>
        <option value="karachi">Karachi</option>
      </select>
    </fieldset>

    <br><br>

    <fieldset>
      <legend>Course Selection</legend>
      <label for="course">Select your course:</label>
      <select id="course" name="course">
        <option value="web">Web Development</option>
        <option value="python">Python Programming</option>
        <option value="data">Data Science</option>
        <option value="data">Cyber Security</option>
      </select>
    </fieldset>

    <br><br>

    <fieldset>
      <legend>Preferred Class Shift</legend>

      <input type="radio" id="morning" name="shift" value="morning">
      <label for="morning">Morning</label>
      <br>

      <input type="radio" id="afternoon" name="shift" value="afternoon">
      <label for="afternoon">Afternoon</label>
      <br>

      <input type="radio" id="evening" name="shift" value="evening">
      <label for="evening">Evening</label>
    </fieldset>

    <br><br>

    <fieldset>
      <legend>Skills</legend>

      <input type="checkbox" id="html" name="skills" value="html">
      <label for="html">HTML</label>
      <br>

      <input type="checkbox" id="css" name="skills" value="css">
      <label for="css">CSS</label>
      <br>

      <input type="checkbox" id="js" name="skills" value="javascript">
      <label for="js">JavaScript</label>
      <br>

      <input type="checkbox" id="py" name="skills" value="python">
      <label for="py">Python</label>
    </fieldset>

    <br><br>

    <fieldset>
      <legend>Motivation</legend>
      <label for="reason">Why do you want to join this course?</label>
      <br>
      <textarea id="reason" name="reason" rows="3" cols="30" placeholder="Write Your Reason here..."></textarea>
      <br><br>
    </fieldset>

    <br><br>

    <fieldset>
      <legend>Additional Information(optional)</legend>

      <label for="portfolio">Portfolio Website URL:</label>
      <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">
      <br><br>

      <label for="startdate">Preferred Starting Date:</label>
      <input type="text" id="startdate" name="startdate" placeholder="DD/MM/YYYY">
      <br><br>
    </fieldset>

    <br>

    <button type="submit">Submit Application</button>
    <button type="reset">Reset</button>

  </form>
</body>
</html>
